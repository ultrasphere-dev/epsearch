[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=77.0.3" ]

[project]
name = "epsearch"
version = "1.1.1"
description = "Locate exceptional points of an analytic matrix"
readme = "README.md"
license = "MIT"
authors = [
  { name = "ultrasphere-dev" },
]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "attrs>=25.4",
  "colormap-complex>=0.2",
  "matplotlib-multicolored-line>=0.3",
  "networkx>=3.4.2",
  "seaborn>=0.13.2",
  "ss-hankel>=1",
]
urls."Bug Tracker" = "https://github.com/ultrasphere-dev/epsearch/issues"
urls.Changelog = "https://github.com/ultrasphere-dev/epsearch/blob/main/CHANGELOG.md"
urls.documentation = "https://epsearch.readthedocs.io"
urls.repository = "https://github.com/ultrasphere-dev/epsearch"

[dependency-groups]
dev = [
  "coverage",
  "joblib>=1.5.2",
  "packaging-34j[test]",
  "pytest>=9,<10",
  "pytest-cov>=7.1.0,<8",
  "tqdm>=4.67.1",
  "tqdm-joblib>=0.0.5",
  "ty",
]
docs = [
  "packaging-34j[docs]",
]

[tool.ruff]
extend = ".venv/ruff.toml"
lint.extend-per-file-ignores = { "docs/conf.py" = [ "A001" ], "src/epsearch/_branching.py" = [
  "A002",
  "C901",
  "DOC201",
  "DOC501",
  "FBT001",
  "FBT002",
  "PGH003",
  "PLR6301",
  "UP046",
  "UP047"
], "src/epsearch/_cycle.py" = [ "DOC501", "UP046", "UP047" ], "src/epsearch/_diff_zeros.py" = [
  "C901",
  "FBT001",
  "FBT002",
  "PLR2004"
], "tests/**/*" = [ "DOC201", "N806", "PGH003", "PLC2701", "PT006", "T201" ] }

[tool.pyproject-fmt]
max_supported_python = "3.14"

[tool.ty]
terminal.error-on-warning = true
